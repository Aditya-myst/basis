<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Basis — evidence lint for AI writing</title>
  <desc id="description">A dark social preview card with the Basis name, its evidence promise, and product facts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="80%">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#glow)"/>
  <rect width="1280" height="640" rx="32" fill="url(#grid)"/>

  <g transform="translate(88 72)">
    <rect width="72" height="72" rx="20" fill="#4ade80"/>
    <path d="M20 37l11 11 22-27" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="66" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="750" letter-spacing="-2">Basis</text>
  </g>

  <text x="88" y="246" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" letter-spacing="3">EVIDENCE LINT FOR AI WRITING</text>
  <text x="88" y="330" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="50" font-weight="650" letter-spacing="-1">Every claim needs a basis.</text>
  <text x="88" y="388" fill="#b6c2d2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27">Check the claim. Read the evidence. Repair without inventing.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="88" y="478" width="178" height="54" rx="27" fill="#162437" stroke="#334155"/>
    <text x="116" y="512" fill="#d9e2ec">24 checks</text>
    <rect x="282" y="478" width="228" height="54" rx="27" fill="#162437" stroke="#334155"/>
    <text x="310" y="512" fill="#d9e2ec">6 claim statuses</text>
    <rect x="526" y="478" width="292" height="54" rx="27" fill="#162437" stroke="#334155"/>
    <text x="554" y="512" fill="#d9e2ec">No invented sources</text>
  </g>

  <g transform="translate(1018 448)" opacity="0.9">
    <circle cx="64" cy="64" r="64" fill="#162437" stroke="#4ade80" stroke-opacity="0.5"/>
    <path d="M35 65l19 19 39-48" fill="none" stroke="#4ade80" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
